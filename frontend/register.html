<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký — TECHNOVA</title><link rel="stylesheet" href="/css/auth.css"></head><body><main class="auth-wrap"><section class="auth-card"><a class="logo" href="/">TECHNOVA</a><h1>Tạo tài khoản</h1><p>Đăng ký tài khoản khách hàng để mua sắm và theo dõi đơn hàng.</p><div id="error" class="error" hidden></div><form id="registerForm"><label>Họ tên</label><input id="fullname" required maxlength="100"><label>Email</label><input id="email" type="email" required><label>Mật khẩu</label><input id="password" type="password" minlength="6" required><label>Nhập lại mật khẩu</label><input id="confirmPassword" type="password" minlength="6" required><button id="submit" class="primary">Đăng ký</button></form><div class="auth-links"><a href="/login">Đã có tài khoản? Đăng nhập</a><a href="/">← Về cửa hàng</a></div></section></main><script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>
