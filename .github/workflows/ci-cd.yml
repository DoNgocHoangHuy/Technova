name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: 20

jobs:
  ci:
    name: Lint and check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate data.json format
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('frontend/data.json', 'utf8'));
            if (!data.users || !data.categories || !data.products || !data.orders) {
              console.error('Invalid data.json schema!');
              process.exit(1);
            }
            console.log('✓ data.json validation passed!');
          "

      - name: Syntax check JavaScript files
        run: |
          node -c frontend/js/mockApi.js frontend/js/app.js frontend/js/auth.js frontend/js/admin.js
          echo "✓ JavaScript syntax check passed!"

  deploy:
    name: Deploy to Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "✓ Triggered Render deployment successfully!"
          else
            echo "⚠️ Secret RENDER_DEPLOY_HOOK_URL is not configured on GitHub. Skipping trigger."
          fi
